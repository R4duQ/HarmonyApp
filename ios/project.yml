# Harmony for iOS: the XcodeGen spec.
#
# The Xcode project is never committed. CI (.github/workflows/ios-build.yml)
# runs `xcodegen generate` in this folder on a macOS runner and builds an
# unsigned arm64 IPA, so the app can be developed on Windows and sideloaded
# with Sideloadly or AltStore.
#
# The audio and ML engines are not copied: the iOS app compiles the very same
# C++ files as the Android app (core/eq-engine and core/dsp-native), so a fix
# to either engine reaches both platforms and is covered by the same host tests.

name: Harmony

options:
  bundleIdPrefix: com.harmony
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: "gnu11"
    # The shared C++ headers, straight from the Android tree.
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../core/eq-engine/src/main/cpp"
      - "$(SRCROOT)/../core/dsp-native/src/main/cpp"
  configs:
    Debug:
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      # -O3 everywhere C/C++/Objective-C++. Not -ffast-math: both engines keep
      # NaN/Inf out of their state with std::isfinite, which -ffast-math lets
      # the compiler fold away (see the per-file flags below).
      GCC_OPTIMIZATION_LEVEL: "3"
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEAD_CODE_STRIPPING: YES
      GCC_PREPROCESSOR_DEFINITIONS: ["NDEBUG=1"]
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Harmony:
    type: application
    platform: iOS
    sources:
      - path: Harmony
      # The shared engines. The flags mirror the Android CMake builds exactly.
      - path: ../core/eq-engine/src/main/cpp/MobileEqEngine.cpp
        group: SharedEngines/Equalizer
        compilerFlags: ["-O3", "-fno-math-errno", "-ffp-contract=fast"]
      - path: ../core/eq-engine/src/main/cpp/MobileEqEngine.h
        group: SharedEngines/Equalizer
        buildPhase: none
      - path: ../core/dsp-native/src/main/cpp/SmartShuffleEngine.cpp
        group: SharedEngines/SmartShuffle
        compilerFlags: ["-O3", "-fno-fast-math"]
      - path: ../core/dsp-native/src/main/cpp/SmartShuffleEngine.h
        group: SharedEngines/SmartShuffle
        buildPhase: none
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: MediaPlayer.framework
      - sdk: Accelerate.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Harmony
        CFBundleName: Harmony
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        # Music keeps playing with the screen off and in the background.
        UIBackgroundModes: [audio]
        # "Harmony" appears as its own folder in Files > On My iPhone: drop music there.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Song recognition listens through the microphone, only when asked.
        NSMicrophoneUsageDescription: "Harmony listens for a few seconds to recognise the song playing around you."
        NSLocalNetworkUsageDescription: "Harmony finds your other devices on this network to play and control music on them."
        NSBonjourServices: ["_harmony._tcp"]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio, public.mp3, org.xiph.flac, public.mpeg-4-audio, com.microsoft.waveform-audio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harmony.app.ios
        PRODUCT_NAME: Harmony
        INFOPLIST_FILE: Config/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Harmony/Bridge/Harmony-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Sideloading re-signs the app; CI signs it ad hoc after the build.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The engines' own -Wall -Wextra clean build, kept as warnings here.
        WARNING_CFLAGS: ["-Wall", "-Wextra"]

schemes:
  Harmony:
    build:
      targets:
        Harmony: all
    run:
      config: Debug
    archive:
      config: Release
