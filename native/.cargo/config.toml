# Android 15+ devices may use 16 KB memory pages: align the libraries for them
# (NDK r28+ already does by default; this keeps it explicit).
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
