name: Android check

# Builds the phone app and runs the playback tests on every pull request that
# touches it, without signing or publishing anything. Publishing stays in
# release.yml.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'playback/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'vendor/**'
      - 'scripts/ci/**'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-android-check-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GO_VERSION: '1.26.6'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  NDK_VERSION: '29.0.14206865'
  SPOTIFLAC_TAG: 'v4.9.6'
  MORNYE_TAG: 'v5.2.5'
  MORNYE_NDK_VERSION: '30.0.16248370'

jobs:
  check:
    name: Build and test (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}" \
            "ndk;${MORNYE_NDK_VERSION}"

      - name: Build pinned SpotiFLAC Go backend
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          SPOTIFLAC_TAG: ${{ env.SPOTIFLAC_TAG }}
          EXPECTED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/build-spotiflac-backend.sh

      - name: Build pinned Mornye Rust backend
        env:
          MORNYE_TAG: ${{ env.MORNYE_TAG }}
          MORNYE_NDK_VERSION: ${{ env.MORNYE_NDK_VERSION }}
        run: bash ./scripts/ci/build-mornye-backend.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: EQ engine host tests (C++) and host JNI library
        run: |
          set -euo pipefail
          cmake -S core/eq-engine/src/test/cpp -B build/eq-engine-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/eq-engine-host --parallel
          ./build/eq-engine-host/eq_engine_test
          echo "HARMONY_EQ_HOST_LIB_DIR=$PWD/build/eq-engine-host" >> "$GITHUB_ENV"

      - name: Smart Shuffle engine host tests (C++, self-test) and host JNI library
        run: |
          set -euo pipefail
          cmake -S core/dsp-native/src/test/cpp -B build/shuffle-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/shuffle-host --parallel
          ./build/shuffle-host/shuffle_test
          echo "HARMONY_SHUFFLE_HOST_LIB_DIR=$PWD/build/shuffle-host" >> "$GITHUB_ENV"

      - name: Playback and download tests
        run: >-
          ./gradlew
          :playback:service:testReleaseUnitTest
          :feature:downloads:testStableReleaseUnitTest
          :feature:downloads:testMornyeReleaseUnitTest
          :core:eq-engine:testReleaseUnitTest
          :core:model:test
          :core:dsp-native:testReleaseUnitTest
          :domain:playback:test
          :domain:shuffle:test
          :feature:player:testDebugUnitTest
          :data:shuffle:testReleaseUnitTest
          :feature:home:testReleaseUnitTest
          --no-daemon
          --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playback-test-report
          path: |
            playback/service/build/reports/tests/
            feature/downloads/build/reports/tests/
            core/eq-engine/build/reports/tests/
            core/dsp-native/build/reports/tests/
            domain/playback/build/reports/tests/
            domain/shuffle/build/reports/tests/
            feature/player/build/reports/tests/
            data/shuffle/build/reports/tests/
            feature/home/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build both apps (unsigned, arm64)
        run: >-
          ./gradlew
          :app:assembleStableRelease
          :app:assembleMornyeRelease
          :core:eq-engine:assembleRelease
          -PharmonyAbi=arm64-v8a
          --no-daemon
          --stacktrace
