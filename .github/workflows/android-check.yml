name: Android check

# Builds the phone app and runs the playback tests on every pull request that
# touches it, without signing or publishing anything. Publishing stays in
# release.yml.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'playback/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-android-check-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GO_VERSION: '1.26.6'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  NDK_VERSION: '29.0.14206865'
  SPOTIFLAC_TAG: 'v4.9.6'

jobs:
  check:
    name: Build and test (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - name: Build pinned SpotiFLAC Go backend
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          SPOTIFLAC_TAG: ${{ env.SPOTIFLAC_TAG }}
          EXPECTED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/build-spotiflac-backend.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Playback tests
        run: >-
          ./gradlew
          :playback:service:testReleaseUnitTest
          --no-daemon
          --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playback-test-report
          path: playback/service/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the app (unsigned, arm64)
        run: >-
          ./gradlew
          :app:assembleRelease
          -PharmonyAbi=arm64-v8a
          --no-daemon
          --stacktrace
