name: Android check

# Builds the phone app and runs the playback tests on every pull request that
# touches it, without signing or publishing anything. Publishing stays in
# release.yml.

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'data/**'
      - 'domain/**'
      - 'feature/**'
      - 'playback/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'vendor/**'
      - 'native/**'
      - 'scripts/ci/**'
      - 'scripts/ytmusic/**'
      - '.github/workflows/android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harmony-android-check-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  NDK_VERSION: '29.0.14206865'
  MORNYE_TAG: 'v5.3.1'
  MORNYE_NDK_VERSION: '30.0.16248370'

jobs:
  check:
    name: Build and test (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}" \
            "ndk;${MORNYE_NDK_VERSION}"

      - name: Install pinned host FFmpeg for Amazon finalizer tests
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # The Linux wheel carries a static FFmpeg binary. Its hash is published by PyPI:
          # https://pypi.org/project/imageio-ffmpeg/0.6.0/#files
          python3 -m venv "$RUNNER_TEMP/host-ffmpeg"
          echo "imageio-ffmpeg==0.6.0 --hash=sha256:c7e46fcec401dd990405049d2e2f475e2b397779df2519b544b8aab515195282" > "$RUNNER_TEMP/host-ffmpeg.txt"
          "$RUNNER_TEMP/host-ffmpeg/bin/pip" install --only-binary=:all: --no-deps --require-hashes --retries 3 --timeout 20 -r "$RUNNER_TEMP/host-ffmpeg.txt"
          FFMPEG=$("$RUNNER_TEMP/host-ffmpeg/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          "$FFMPEG" -version
          echo "HARMONY_TEST_FFMPEG=$FFMPEG" >> "$GITHUB_ENV"

      - name: Build pinned Mornye Rust backend
        env:
          MORNYE_TAG: ${{ env.MORNYE_TAG }}
          MORNYE_NDK_VERSION: ${{ env.MORNYE_NDK_VERSION }}
        run: bash ./scripts/ci/build-mornye-backend.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Harmony's native code (song analyzer, EQ engine, Smart Shuffle) is Rust,
      # in native/. Its own tests and lints first, then the host JNI libraries
      # the JVM unit tests below load. Gradle builds the Android libraries
      # itself (the harmony.rust.jni plugin) with the toolchain pinned in
      # native/rust-toolchain.toml.
      - name: Rust native libraries (fmt, clippy, tests, host JNI libraries)
        working-directory: native
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          cargo fmt --check
          cargo clippy --locked --all-targets --features harmonyeq/testing,harmonyshuffle/testing -- -D warnings
          cargo clippy --locked --release --target aarch64-linux-android -- -D warnings
          cargo test --locked --release --features harmonyeq/testing,harmonyshuffle/testing
          cargo build --locked --release
          echo "HARMONY_EQ_HOST_LIB_DIR=$PWD/target/release" >> "$GITHUB_ENV"
          echo "HARMONY_SHUFFLE_HOST_LIB_DIR=$PWD/target/release" >> "$GITHUB_ENV"

      - name: YouTube Music conformance (ytmusicapi 1.12.3, pinned by hash)
        run: |
          set -euo pipefail
          python3 -m venv build/ytmusic-venv
          build/ytmusic-venv/bin/pip install --no-deps --require-hashes -r scripts/ytmusic/requirements.txt
          # The derived fixtures are what the script makes from the real ones, nothing else.
          build/ytmusic-venv/bin/python -I scripts/ytmusic/derive_fixtures.py domain/online/src/test/resources/ytmusic
          git diff --exit-code -- domain/online/src/test/resources/ytmusic/derived
          # ytmusicapi's own parsers still read the recorded answers as the committed outputs say.
          build/ytmusic-venv/bin/python -I scripts/ytmusic/expected_outputs.py domain/online/src/test/resources/ytmusic --check

      - name: Playback and download tests
        run: >-
          ./gradlew
          :playback:service:testReleaseUnitTest
          :feature:downloads:testReleaseUnitTest
          :core:eq-engine:testReleaseUnitTest
          :core:model:test
          :core:remote:test
          :core:dsp-native:testReleaseUnitTest
          :domain:playback:test
          :domain:shuffle:test
          :domain:online:test
          :feature:player:testDebugUnitTest
          :data:shuffle:testReleaseUnitTest
          :feature:home:testReleaseUnitTest
          --no-daemon
          --stacktrace

      - name: Online mix local-library regression
        run: ./gradlew :app:testDebugUnitTest --tests 'com.harmony.app.LibraryLocalCopiesTest' --no-daemon --stacktrace

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playback-test-report
          path: |
            playback/service/build/reports/tests/
            feature/downloads/build/reports/tests/
            core/eq-engine/build/reports/tests/
            core/dsp-native/build/reports/tests/
            core/remote/build/reports/tests/
            domain/playback/build/reports/tests/
            domain/shuffle/build/reports/tests/
            domain/online/build/reports/tests/
            feature/player/build/reports/tests/
            data/shuffle/build/reports/tests/
            feature/home/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build the app (unsigned, arm64)
        run: >-
          ./gradlew
          :app:assembleRelease
          :core:eq-engine:assembleRelease
          -PharmonyAbi=arm64-v8a
          --no-daemon
          --stacktrace
