name: Publish online mix build 161

on:
  push:
    branches: ['codex/publish-online-build-161']
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: harmony-release-refs/heads/main
  cancel-in-progress: false

env:
  APP_SOURCE_SHA: '5afc3d0aa8479221449d08f22969df90f2cb350e'
  JAVA_VERSION: '17'
  GO_VERSION: '1.26.6'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  NDK_VERSION: '29.0.14206865'
  SPOTIFLAC_TAG: 'v4.9.6'
  # The Mornye build's download runtime (Rust), and the NDK Mornye pins for it.
  MORNYE_TAG: 'v5.3.1'
  MORNYE_NDK_VERSION: '30.0.16248370'

jobs:
  release:
    name: Signed phone + emulator APKs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.APP_SOURCE_SHA }}

      - name: Verify approved source
        run: test "$(git rev-parse HEAD)" = "$APP_SOURCE_SHA"

      - name: Resolve release tag
        id: tag
        run: |
          set -euo pipefail
          echo "release_tag=v1.0" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches Android version
        id: version
        run: bash ./scripts/ci/verify-release-version.sh app/build.gradle.kts "${{ steps.tag.outputs.release_tag }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}" \
            "ndk;${MORNYE_NDK_VERSION}"

      - name: Build pinned SpotiFLAC Go backend
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          SPOTIFLAC_TAG: ${{ env.SPOTIFLAC_TAG }}
          EXPECTED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/build-spotiflac-backend.sh

      - name: Build pinned Mornye Rust backend
        env:
          MORNYE_TAG: ${{ env.MORNYE_TAG }}
          MORNYE_NDK_VERSION: ${{ env.MORNYE_NDK_VERSION }}
        run: bash ./scripts/ci/build-mornye-backend.sh

      - name: Live YouTube Music diagnostic (anonymous, RO)
        continue-on-error: true
        env:
          HARMONY_LIVE_YTM: '1'
          HARMONY_LIVE_YTM_GL: RO
        run: bash ./gradlew :domain:online:test --tests '*YtMusicLiveTest*' --info --no-daemon --stacktrace

      - name: Require passing CI and merged source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CI_RUN: '43061640739'
        shell: bash
        run: |
          set -euo pipefail
          api() {
            for pause in 1 2 4 8 16; do
              if gh api "$@"; then return 0; fi
              sleep "$pause"
            done
            return 1
          }
          for attempt in $(seq 1 360); do
            if ! pr=$(api "repos/$GITHUB_REPOSITORY/pulls/75"); then sleep 10; continue; fi
            test "$(jq -r '.head.sha' <<< "$pr")" = "$APP_SOURCE_SHA"
            if ! verdict=$(api "repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_CI_RUN" --jq '.conclusion // ""'); then sleep 10; continue; fi
            if [[ -n "$verdict" && "$verdict" != "success" ]]; then
              echo "Required Android check did not pass: $verdict"
              exit 1
            fi
            if [[ "$verdict" == "success" && "$(jq -r '.merged' <<< "$pr")" == "true" ]]; then
              merge_sha=$(jq -r '.merge_commit_sha' <<< "$pr")
              if ! merged_tree=$(api "repos/$GITHUB_REPOSITORY/git/commits/$merge_sha" --jq '.tree.sha'); then sleep 10; continue; fi
              test "$merged_tree" = "$(git rev-parse 'HEAD^{tree}')"
              echo "Approved merged source $merge_sha has the tested tree $merged_tree"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the reviewed merge"
          exit 1

      - name: Restore release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HARMONY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!value:-}" ]]; then
              echo "ERROR: Required Harmony GitHub Actions signing secret for $value is missing." >&2
              exit 20
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          chmod 600 release.keystore
          keytool -list -keystore release.keystore -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Kotlin release preflight
        env:
          HARMONY_KEYSTORE_FILE: release.keystore
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :core:database:compileReleaseKotlin
          :domain:shuffle:test
          :feature:player:compileReleaseKotlin
          :feature:downloads:compileStableReleaseKotlin
          :feature:downloads:compileMornyeReleaseKotlin
          :feature:downloads:testStableReleaseUnitTest
          :playback:service:testReleaseUnitTest
          :domain:library:test
          :data:library:testReleaseUnitTest
          :feature:discover:compileReleaseKotlin
          :feature:discover:testReleaseUnitTest
          :feature:library:testReleaseUnitTest
          :feature:playlists:testReleaseUnitTest
          --no-daemon
          --stacktrace

      - name: Build signed arm64 phone APK
        env:
          HARMONY_KEYSTORE_FILE: release.keystore
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:assembleStableRelease
          -PharmonyAbi=arm64-v8a
          --no-daemon
          --stacktrace

      - name: Verify and package arm64 phone APK
        run: bash ./scripts/ci/package-release.sh "${{ steps.version.outputs.version_name }}" arm64-v8a stable

      - name: Build signed arm64 Mornye phone APK
        env:
          HARMONY_KEYSTORE_FILE: release.keystore
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:assembleMornyeRelease
          -PharmonyAbi=arm64-v8a
          --no-daemon
          --stacktrace

      - name: Verify and package arm64 Mornye phone APK
        run: bash ./scripts/ci/package-release.sh "${{ steps.version.outputs.version_name }}" arm64-v8a mornye

      - name: Build signed x86_64 emulator APK
        env:
          HARMONY_KEYSTORE_FILE: release.keystore
          HARMONY_KEYSTORE_PASSWORD: ${{ secrets.HARMONY_KEYSTORE_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
        run: >-
          ./gradlew
          :app:clean
          :app:assembleStableRelease
          -PharmonyAbi=x86_64
          --no-daemon
          --stacktrace

      - name: Verify and package x86_64 emulator APK
        run: bash ./scripts/ci/package-release.sh "${{ steps.version.outputs.version_name }}" x86_64 stable

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harmony-v${{ steps.version.outputs.version_name }}-release-apks
          path: |
            dist/Harmony-v${{ steps.version.outputs.version_name }}-arm64-v8a.apk
            dist/Harmony-v${{ steps.version.outputs.version_name }}-mornye-arm64-v8a.apk
            dist/Harmony-v${{ steps.version.outputs.version_name }}-x86_64.apk
            dist/SHA256SUMS.txt
            dist/APK-SIGNATURE.txt
            vendor-maven/com/harmony/vendor/gobackend/4.9.6/gobackend-4.9.6.aar.source.txt
            vendor-maven/com/harmony/vendor/gobackend/4.9.6/gobackend-4.9.6.aar.sha256.txt
            vendor-mornye/SOURCE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          set -euo pipefail
          RELEASE_TITLE="Harmony v${VERSION_NAME}"
          NOTES="docs/RELEASE-v${VERSION_NAME}-STABLE.md"
          if [[ ! -f "$NOTES" ]]; then
            NOTES="docs/RELEASE-v1.0.0-STABLE.md"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --title "$RELEASE_TITLE" --notes-file "$NOTES"
            gh release upload "${RELEASE_TAG}" --clobber \
              "dist/Harmony-v${VERSION_NAME}-arm64-v8a.apk#Harmony v${VERSION_NAME} — Android arm64-v8a" \
              "dist/Harmony-v${VERSION_NAME}-mornye-arm64-v8a.apk#Harmony v${VERSION_NAME} Mornye — Android arm64-v8a (new download runtime)" \
              "dist/Harmony-v${VERSION_NAME}-x86_64.apk#Harmony v${VERSION_NAME} — Android Emulator x86_64" \
              "dist/SHA256SUMS.txt#SHA-256 checksums" \
              "dist/APK-SIGNATURE.txt#APK signing certificate details"
          else
            gh release create "${RELEASE_TAG}" \
              --title "$RELEASE_TITLE" \
              --notes-file "$NOTES" \
              --target "${GITHUB_SHA}" \
              "dist/Harmony-v${VERSION_NAME}-arm64-v8a.apk#Harmony v${VERSION_NAME} — Android arm64-v8a" \
              "dist/Harmony-v${VERSION_NAME}-mornye-arm64-v8a.apk#Harmony v${VERSION_NAME} Mornye — Android arm64-v8a (new download runtime)" \
              "dist/Harmony-v${VERSION_NAME}-x86_64.apk#Harmony v${VERSION_NAME} — Android Emulator x86_64" \
              "dist/SHA256SUMS.txt#SHA-256 checksums" \
              "dist/APK-SIGNATURE.txt#APK signing certificate details"
          fi

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f release.keystore keystore.properties
