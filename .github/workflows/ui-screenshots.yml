name: UI screenshots

# Renders ThemeShowcaseScreenshotTest (the same screens in light and dark) on
# the JVM with Roborazzi + Robolectric, and keeps the PNGs on the branch
# ui-screenshots/<label>, so they can be looked at and compared without an
# emulator. Runs on pushes to work branches that touch the UI (the label is
# the commit), or by hand from the Actions tab with a label of your choice.

on:
  push:
    branches: ['claude/**']
    paths:
      - 'app/**'
      - 'core/ui/**'
      - 'feature/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:
    inputs:
      label:
        description: 'Name for this set of screenshots (the branch becomes ui-screenshots/<label>)'
        required: true
        default: 'latest'

permissions:
  contents: write

concurrency:
  group: harmony-ui-screenshots-${{ github.ref }}-${{ inputs.label || github.sha }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  GO_VERSION: '1.26.6'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  NDK_VERSION: '29.0.14206865'
  SPOTIFLAC_TAG: 'v4.9.6'

jobs:
  shots:
    name: Light and dark screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      # The app depends on the downloads module, which needs this backend to build.
      - name: Build pinned SpotiFLAC Go backend
        env:
          NDK_VERSION: ${{ env.NDK_VERSION }}
          SPOTIFLAC_TAG: ${{ env.SPOTIFLAC_TAG }}
          EXPECTED_GO_VERSION: ${{ env.GO_VERSION }}
        run: bash ./scripts/ci/build-spotiflac-backend.sh

      - name: Render the screenshots
        run: >-
          chmod +x ./gradlew &&
          ./gradlew :app:testStableDebugUnitTest
          --tests 'com.harmony.app.ThemeShowcaseScreenshotTest'
          -Proborazzi.test.record=true
          --no-daemon --stacktrace

      - name: Keep them on a ui-screenshots branch
        env:
          LABEL: ${{ inputs.label || github.sha }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$PWD/app/build/outputs/roborazzi"
          ls -la "$src"
          out="$(mktemp -d)"
          cp "$src"/*.png "$out"/
          cd "$out"
          printf 'Screenshots from %s (%s), run %s.\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "UI screenshots: ${LABEL} from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/ui-screenshots/${LABEL}"

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-report
          path: app/build/reports/tests/
