<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bricolage;src:url(bricolage_grotesque.ttf);font-weight:200 800}
@font-face{font-family:Figtree;src:url(figtree.ttf);font-weight:300 900}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1000px;height:1000px;background:radial-gradient(800px 600px at 50% 40%,#6c7e3a,#4d5e27);font-family:Figtree,sans-serif;display:flex;gap:60px;justify-content:center;align-items:center}
.col{text-align:center;font-size:15px;color:rgba(255,255,255,.85);font-weight:600}.col .t{margin-bottom:12px}
.scr{width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.4);text-align:left;color:var(--ink);background:var(--ground)}
.scr>*{position:absolute}
.amber{--ground:#15120F;--surface:#1E1A16;--raised:#29241F;--ink:#F5EEE5;--muted:#BCAF9F;--line:#38312A;--amber:#FFB54D;--onamber:#2A1700;--atext:#FFC470;--asoft:#4A3010;--onasoft:#FFE2B8;--rec:#0E0B09;--lab:#d97a2c}
.green{--ground:#131A0A;--surface:#1D2610;--raised:#28331A;--ink:#F1F6E3;--muted:#B0BD8D;--line:#36432A;--amber:#C8F52F;--onamber:#1A2503;--atext:#D6FF5A;--asoft:#3A4A0F;--onasoft:#E6FF9A;--rec:#0A0F06;--lab:#d97a2c}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;viewBox:0 0 24 24}
.c{border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center}
.nm{font-family:Bricolage,sans-serif;font-weight:600}
.chip{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:6px;padding:0 14px;font-size:14px;font-weight:600}
.act{width:25%;text-align:center;font-size:12.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.act svg{width:22px;height:22px;color:var(--ink)}
</style></head><body>
<script>
function SVG(p,f){return `<svg viewBox="0 0 24 24" ${f?'style="fill:currentColor;stroke:none"':''}>${p}</svg>`}
const P={back:'<path d="M20 12H5M11 5l-7 7 7 7"/>',more:'<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>',
heart:'<path d="M12 20s-8-4.800-8-11a4.500 4.500 0 018-2.700A4.500 4.500 0 0120 9c0 6.200-8 11-8 11z"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
rep:'<path d="M4 11V9a3 3 0 013-3h12M16 3l3 3-3 3M20 13v2a3 3 0 01-3 3H5M8 21l-3-3 3-3"/>',shuf:'<path d="M3 7h3c5 0 6 10 11 10h4M3 17h3c1.500 0 2.600-.8 3.500-2M14 9c.9-1.200 2-2 3.500-2H21M18 4l3 3-3 3M18 14l3 3-3 3"/>',
prev:'<path d="M6 5h2v14H6zM20 5v14L9 12z"/>',next:'<path d="M16 5h2v14h-2zM4 5v14l11-7z"/>',pause:'<path d="M7 4h3.500v16H7zM13.500 4H17v16h-3.500z"/>',
queue:'<path d="M4 6h12M4 11h12M4 16h7M17 14v6l4-3z"/>',spark:'<path d="M10 3l1.800 5.200L17 10l-5.200 1.800L10 17l-1.800-5.200L3 10l5.200-1.800zM18 14l.9 2.600 2.600.9-2.600.9L18 21l-.9-2.600-2.600-.9 2.600-.9z"/>',
spk:'<rect x="6" y="3" width="12" height="18" rx="3"/><circle cx="12" cy="14" r="3"/><circle cx="12" cy="7" r=".8"/>',eq:'<path d="M5 4v16M12 4v16M19 4v16"/><circle cx="5" cy="14" r="2.200" fill="var(--ground)"/><circle cx="12" cy="8" r="2.200" fill="var(--ground)"/><circle cx="19" cy="15" r="2.200" fill="var(--ground)"/>',
bed:'<path d="M20 14a8 8 0 11-10-10 6.500 6.500 0 0010 10z"/>',bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',down:'<path d="M6 9l6 6 6-6"/>',tune:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const pk=[1,2,3,4,5,6,6,7,8,9,12,15,18,22,26,30,34,30,26,24,22,20,18,16,20,24,28,26,22,18,16,18,20,22,24,36,40,44,44,44,40,34,30,26,24,26,28,30,28,24,20,18,16,14,12,12,14,12,10,8,6,4,3,2];
function SCREEN(cls){let w='';for(let k=0;k<64;k++)w+=`<b style="display:block;width:4px;border-radius:2px;height:${6+pk[k]*1.1}px;background:${k<36?'var(--atext)':'var(--line)'}"></b>`;
return `<div class="scr ${cls}">
<div class="c" style="left:20px;top:44px;width:46px;height:46px">${SVG(P.back)}</div>
<div style="left:0;right:0;top:46px;text-align:center"><div style="font-size:9px;letter-spacing:1.6px;font-weight:500;color:var(--muted)">NOW PLAYING FROM</div><div style="font-size:14.5px;font-weight:600;margin-top:3px">Harbour Lights</div></div>
<div class="c" style="right:20px;top:44px;width:46px;height:46px">${SVG(P.more)}</div>
<div style="left:20px;top:112px;width:350px;height:252px">
 <div style="position:absolute;right:0;top:3px;width:246px;height:246px;border-radius:50%;background:repeating-radial-gradient(circle,var(--rec) 0 3px,#17120d 4px 5px);box-shadow:0 8px 24px rgba(0,0,0,.5)"><div style="position:absolute;inset:33%;border-radius:50%;background:radial-gradient(circle,var(--rec) 0 10%,var(--lab) 11%)"></div></div>
 <div style="position:absolute;left:0;top:3px;width:246px;height:246px;border-radius:14px;background:radial-gradient(circle at 50% 54%,#f8c64f 0 20%,transparent 21%),radial-gradient(circle at 30% 20%,#e0803a,#a2541f 70%,#7a3a14);box-shadow:0 18px 36px rgba(0,0,0,.45)"></div></div>
<div class="nm" style="left:20px;top:392px;font-size:25px;letter-spacing:-.4px">Night Ferry</div>
<div style="left:20px;top:427px;font-size:18px;font-weight:500;color:var(--muted)">Mira Sol</div>
<div class="c" style="right:20px;top:396px;width:44px;height:44px;color:var(--atext)">${SVG(P.heart,1)}</div>
<div style="left:20px;right:20px;top:468px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px"><span style="width:16px;height:16px;display:inline-block">${SVG(P.info).replace('width:20px','')}</span><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">You play it most on weekday evenings</span><span style="border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-size:12px;font-weight:600;letter-spacing:.4px;color:var(--ink)">HI-RES 24/96</span></div>
<div style="left:20px;top:508px;width:350px;height:52px;display:flex;align-items:center;gap:2px">${w}</div>
<div style="left:20px;top:566px;font-size:12px;color:var(--muted);font-weight:500">1:34</div><div style="right:20px;top:566px;font-size:12px;color:var(--muted);font-weight:500">2:50</div>
<div style="left:20px;right:20px;top:596px;height:72px;display:flex;align-items:center;justify-content:space-between">
 <div class="c" style="width:48px;height:48px">${SVG(P.rep)}</div>
 <div class="c" style="width:54px;height:54px"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:28px;height:28px">${P.prev}</svg></div>
 <div class="c" style="width:72px;height:72px;background:var(--amber);border:1px solid var(--amber);color:var(--onamber)"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:34px;height:34px">${P.pause}</svg></div>
 <div class="c" style="width:54px;height:54px"><svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:28px;height:28px">${P.next}</svg></div>
 <div class="c" style="width:48px;height:48px;color:var(--atext)">${SVG(P.shuf)}</div></div>
<div style="left:0;right:0;top:686px;display:flex;justify-content:center;gap:4px"><div class="chip">${SVG(P.bed)}Calmer</div><div class="chip">${SVG(P.bolt)}Livelier</div><div class="chip">Mood${SVG(P.down)}</div><div class="chip">${SVG(P.tune)}Tune</div></div>
<div style="left:20px;right:20px;top:752px;display:flex"><div class="act">${SVG(P.queue)}Queue · 14</div><div class="act" style="color:var(--atext)"><svg viewBox="0 0 24 24" style="color:var(--atext)">${P.spark}</svg>Steer</div><div class="act">${SVG(P.spk)}Phone speaker</div><div class="act">${SVG(P.eq)}Sound</div></div>
</div>`}
document.body.innerHTML=`<div class="col"><div class="t">Now Playing today (build 175, dark)</div>${SCREEN('amber')}</div><div class="col"><div class="t">Same page, only the colors changed</div>${SCREEN('green')}</div>`;
</script></body></html>
