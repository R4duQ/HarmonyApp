<!doctype html><html><head><meta charset="utf-8"><title>Harmony x TuneHive mockups</title>
<style>
:root{--acc:#c8f52f;--acc2:#8fb81c;--tx:#eef4dc;--mu:#93a06c;--card:rgba(255,255,255,.065);--line:rgba(200,245,47,.16);--bg1:#26311400}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Figtree","Inter","Segoe UI",system-ui,sans-serif;background:#333;color:var(--tx)}
.sheet{width:1536px;height:1100px;position:relative;overflow:hidden;margin:0 0 20px;
 background:radial-gradient(900px 600px at 50% 40%,#6c7e3a,#586a2d 60%,#4d5e27);display:flex;align-items:center;justify-content:center;gap:62px}
.sheet:before{content:"";position:absolute;inset:0;background:
 radial-gradient(ellipse 900px 420px at 80% -10%,transparent 60%,rgba(255,255,255,.18) 60.2%,transparent 60.5%),
 radial-gradient(ellipse 700px 300px at 10% 110%,transparent 60%,rgba(255,255,255,.15) 60.2%,transparent 60.5%)}
.cap{position:absolute;top:28px;left:0;right:0;text-align:center;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600}
.lbl{position:absolute;bottom:26px;text-align:center;width:417px;font-size:16px;color:rgba(255,255,255,.78);font-weight:600}
.ph{width:417px;height:905px;border-radius:58px;position:relative;overflow:hidden;flex:none;
 background:linear-gradient(180deg,#27320f,#161d09 55%,#121807);box-shadow:0 40px 70px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.06) inset}
.ph.mid{margin-top:60px}
.sb{display:flex;justify-content:space-between;align-items:center;padding:22px 38px 0;font-weight:600;font-size:16px;position:relative;z-index:5}
.sb .r{display:flex;gap:7px;align-items:center}
.pad{padding:0 28px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
.circ{width:46px;height:46px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;color:var(--tx)}
h1{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.01em}
h2{font-size:19px;font-weight:600}
.mu{color:var(--mu)}
.row{display:flex;align-items:center}
.sp{justify-content:space-between}
.chips{display:flex;gap:10px;overflow:hidden;margin-top:14px;padding-left:28px}
.chip{flex:none;padding:9px 20px;border-radius:30px;font-size:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx)}
.chip.on{background:var(--acc);color:#18200a;font-weight:700;border-color:var(--acc)}
.cov{border-radius:18px;position:relative;overflow:hidden;flex:none}
.c1{background:radial-gradient(circle at 50% 56%,#f8c64f 0 22%,transparent 23%),linear-gradient(135deg,#e07b2e,#8f3f16)}
.c2{background:repeating-radial-gradient(circle at 50% 50%,transparent 0 9px,rgba(255,255,255,.28) 10px 11px),linear-gradient(135deg,#2f6bd9,#16327e)}
.c3{background:linear-gradient(180deg,#b9a3f2 0 55%,#4c33a0 55% 70%,#251563 70%)}
.c4{background:radial-gradient(circle at 30% 30%,#ffd1c4,transparent 50%),linear-gradient(135deg,#e5566f,#7b2056)}
.c5{background:conic-gradient(from 40deg at 50% 50%,#2fd0a4,#1a7f78,#0e3f4f,#2fd0a4)}
.c6{background:linear-gradient(160deg,#f4e285 0 40%,#e9902f 40% 70%,#8c3a1a 70%)}
.c7{background:radial-gradient(circle at 70% 30%,#fff 0 6%,transparent 7%),linear-gradient(200deg,#4a4a8c,#12123a)}
.c8{background:repeating-linear-gradient(45deg,#b6e24a 0 12px,#8dbb2b 12px 24px)}
.nav{position:absolute;left:28px;right:28px;bottom:30px;height:78px;border-radius:44px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px;backdrop-filter:blur(8px)}
.nav .n{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#c8d3a4;background:rgba(255,255,255,.05);border:1px solid var(--line);position:relative}
.nav .n.on{background:var(--acc);color:#17200a;border-color:var(--acc);box-shadow:0 0 30px rgba(200,245,47,.35)}
.nav small{position:absolute;bottom:-17px;font-size:10px;color:var(--mu);letter-spacing:.04em}
.btn{background:var(--acc);color:#18200a;font-weight:700;border-radius:30px;padding:10px 18px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mini{position:absolute;left:20px;right:20px;bottom:124px;height:66px;border-radius:24px;background:rgba(48,62,22,.92);border:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;backdrop-filter:blur(8px)}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.12);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:rgba(200,245,47,.1);color:var(--acc)}
.ttl{font-size:15px;font-weight:600}
.sub{font-size:12.5px;color:var(--mu);margin-top:2px}
.lst{display:flex;flex-direction:column;gap:12px}
.li{display:flex;align-items:center;gap:13px}
.li .cov{width:52px;height:52px;border-radius:14px}
.li .t{flex:1;min-width:0}
.sec{margin:20px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px}
.sw{width:42px;height:24px;border-radius:14px;background:var(--acc);position:relative}.sw:after{content:"";position:absolute;right:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#18200a}
.sw.off{background:rgba(255,255,255,.14)}.sw.off:after{right:auto;left:3px;background:#a7b27f}
.wave{display:flex;align-items:center;gap:3px;height:56px}
.wave b{display:block;width:4px;border-radius:2px;background:rgba(255,255,255,.22)}
.wave b.p{background:var(--acc)}
</style></head><body>

<script>
function I(n,c=""){return `<svg class="i ${c}"><use href="#${n}"/></svg>`}
function SB(){return `<div class="sb"><span>9:41</span><span class="r">${I('sig','f')}${I('wifi')}<svg style="width:26px;height:13px"><use href="#bat"/></svg></span></div>`}
function NAV(on){const it=[['home','Listen'],['lib','Library'],['plus','Add'],['eq','Sound']];
 return `<div class="nav">${it.map((x,k)=>`<div class="n ${k==on?'on':''}">${I(x[0])}<small>${k==on?'':x[1]}</small></div>`).join('')}</div>`}
function WAVE(n,p,h=56,seed=3){let s='';for(let k=0;k<n;k++){const v=Math.abs(Math.sin(k*.37+seed)*.55+Math.sin(k*.11+seed*2)*.45);s+=`<b class="${k/n<p?'p':''}" style="height:${10+v*(h-12)}px"></b>`}return `<div class="wave" style="height:${h}px">${s}</div>`}
function HEAD(){return `<svg viewBox="0 0 340 380" width="340" height="380">
<defs>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3f5c08"/><stop offset=".18" stop-color="#9fd11f"/><stop offset=".4" stop-color="#e4ff62"/><stop offset=".62" stop-color="#8fc215"/><stop offset="1" stop-color="#2f4707"/></linearGradient>

<radialGradient id="shellR" cx=".7" cy=".2" r="1"><stop offset="0" stop-color="#e9ff7f"/><stop offset=".25" stop-color="#a6d822"/><stop offset=".65" stop-color="#4d7309"/><stop offset="1" stop-color="#1a2a04"/></radialGradient>
<radialGradient id="cush" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#0d1503"/><stop offset=".55" stop-color="#16220a"/><stop offset=".8" stop-color="#3f5d0b"/><stop offset="1" stop-color="#91bf24"/></radialGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6ffb0"/><stop offset=".4" stop-color="#9ccc1c"/><stop offset="1" stop-color="#2a4206"/></linearGradient>
<linearGradient id="yoke" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2c4606"/><stop offset=".45" stop-color="#d4f84a"/><stop offset="1" stop-color="#34510a"/></linearGradient>
<filter id="bl"><feGaussianBlur stdDeviation="7"/></filter><filter id="bl2"><feGaussianBlur stdDeviation="2.500"/></filter>
<clipPath id="bandclip"><path d="M52 232C28 100 92 28 170 28s142 72 118 204" fill="none"/></clipPath>
</defs>
<ellipse cx="170" cy="362" rx="125" ry="13" fill="#c8f52f" opacity=".3" filter="url(#bl)"/>
<ellipse cx="170" cy="355" rx="90" ry="7" fill="#000" opacity=".35" filter="url(#bl)"/>
<!-- headband -->
<path d="M52 232C28 100 92 28 170 28s142 72 118 204" fill="none" stroke="#1d2d04" stroke-width="40" stroke-linecap="round"/>
<path d="M52 232C28 100 92 28 170 28s142 72 118 204" fill="none" stroke="url(#band)" stroke-width="34" stroke-linecap="round"/>
<path d="M66 205C52 112 104 50 170 50s112 56 98 150" fill="none" stroke="url(#bandIn)" stroke-width="16" stroke-linecap="round" opacity=".85"/>
<path d="M44 200C26 108 84 36 160 33" fill="none" stroke="#f6ffc0" stroke-width="5" stroke-linecap="round" opacity=".75" filter="url(#bl2)"/>
<path d="M300 190C312 120 270 58 214 40" fill="none" stroke="#e6ff7a" stroke-width="3" stroke-linecap="round" opacity=".45" filter="url(#bl2)"/>

 <ellipse cx="82" cy="296" rx="64" ry="84" fill="#10190a" opacity=".6" filter="url(#bl2)"/>

</g>
<!-- right cup (3/4 view) -->

</g>

function VINYL(sz){return `<div style="position:absolute;right:-${sz*.22}px;top:${sz*.04}px;width:${sz*.92}px;height:${sz*.92}px;border-radius:50%;background:repeating-radial-gradient(circle,#0b0d06 0 3px,#151a0b 4px 5px);box-shadow:0 8px 20px rgba(0,0,0,.5)"><div style="position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#161d09 0 12%,#e07b2e 13%)"></div></div>`}

<script>
const $=id=>document.getElementById(id);
/* ---------- 1A welcome ---------- */
$('p1a').innerHTML=SB()+`<div style="text-align:center;margin-top:34px;font-size:28px;color:var(--acc);font-weight:500">Harmony</div>

<div style="position:absolute;left:24px;right:24px;bottom:28px;height:76px;border-radius:40px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:14px">

<div class="circ" style="width:58px;height:58px">${I('hp')}</div></div>`;
/* ---------- 1B home ---------- */
$('p1b').innerHTML=SB()+`<div class="pad row sp" style="margin-top:20px"><div class="row" style="gap:14px">
<div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#e07b2e,#7a3d12);border:2px solid var(--acc2);display:grid;place-items:center;font-weight:700">A</div>
<div><div class="mu" style="font-size:13px">Good evening!</div><div style="font-size:21px;font-weight:600">Your music</div></div></div>
<div class="row" style="gap:8px"><div class="circ" style="width:44px;height:44px">${I('search')}</div><div class="circ" style="width:44px;height:44px;position:relative">${I('bell')}<span style="position:absolute;top:9px;right:11px;width:9px;height:9px;border-radius:50%;background:var(--acc)"></span></div></div></div>

<div class="chips"><span class="chip on">All</span><span class="chip">Songs</span><span class="chip">Albums</span><span class="chip">Artists</span><span class="chip">Playlists</span></div>
